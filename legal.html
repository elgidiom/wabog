**Última actualización: 25 de septiembre de 2026**

Estos Términos y Condiciones regulan el acceso y uso de la plataforma **WABOG**, disponible en wabog.com, app.wabog.com y los demás canales habilitados (aplicaciones, integraciones y mensajería). Al registrarte, contratar una suscripción o usar el servicio, aceptas estos Términos. Se rigen por la legislación de la República de Colombia.

**NIT:** 902030041 - 2

## **2. Qué es WABOG**

WABOG es una plataforma tecnológica de apoyo para abogados, firmas y departamentos jurídicos. Según el plan contratado, permite registrar y organizar procesos judiciales, consultar información de fuentes públicas, detectar nuevas publicaciones o actuaciones, enviar alertas por correo, WhatsApp u otros canales, organizar tareas, contactos y equipos, y generar reportes o resúmenes, incluso con apoyo de inteligencia artificial.

Las funcionalidades pueden variar según el plan, la fuente consultada, el tipo de proceso y las capacidades técnicas disponibles.

## **3. WABOG ayuda; la gestión profesional es del abogado**

WABOG es una herramienta de apoyo. No es un abogado, no presta asesoría jurídica y no reemplaza el criterio ni las obligaciones profesionales del Usuario.

La responsabilidad sobre cada proceso es siempre del Usuario. Le corresponde, entre otras cosas, controlar los términos y fechas límite, asistir a las audiencias, revisar los expedientes y las providencias, presentar memoriales y recursos, y verificar la información antes de usarla.

Las alertas, notificaciones, reportes, resúmenes y consultas de WABOG son un apoyo tecnológico. No son una certificación oficial de la existencia, el contenido ni el estado de una actuación. Contratar WABOG no transfiere a WABOG la representación judicial, la custodia del proceso ni la responsabilidad que el abogado tiene frente a sus clientes.

## **4. Fuentes de información**

WABOG obtiene información de fuentes públicas y oficiales, como la Rama Judicial, estados electrónicos y publicaciones procesales. WABOG no crea ni controla esas fuentes. Si hay diferencias o dudas, prevalece la información publicada por la autoridad y el Usuario debe consultarla directamente.

## **5. Limitaciones del servicio**

El monitoreo depende en parte de sistemas de terceros y de procesos automatizados. Por eso pueden presentarse indisponibilidades de las fuentes, cambios en los sitios oficiales, publicaciones tardías o con errores, documentos ilegibles, retrasos, omisiones o fallas en el envío de alertas.

WABOG toma medidas razonables para detectar y corregir estos eventos, pero no garantiza un servicio ininterrumpido, un monitoreo en tiempo real, ni que todas las actuaciones sean detectadas o notificadas de forma inmediata. La recepción de una alerta también depende de terceros, como el correo, WhatsApp, el operador móvil o la configuración del dispositivo del Usuario.

## **6. Información que registras**

El Usuario es responsable de que la información que registra sea correcta y esté actualizada: radicados, despachos, datos de contacto, miembros del equipo y datos de sus clientes. Debe verificar especialmente sus procesos después de una carga masiva o importación.

## **7. Procesos reservados o de acceso limitado**

Registrar un proceso en WABOG no implica acceso al expediente completo ni a documentos reservados. WABOG solo consulta información que sea técnicamente accesible y cuyo tratamiento esté permitido.

## **8. Inteligencia artificial**

Algunas funciones usan inteligencia artificial. Sus resultados pueden contener errores, omisiones o información desactualizada, y no constituyen asesoría jurídica. El Usuario debe verificarlos contra el documento o la fuente oficial antes de usarlos profesionalmente.

## **9. Datos personales y confidencialidad**

Los datos personales se tratan según la Política de Privacidad y la Política de Tratamiento de Datos Personales de WABOG. El Usuario que registre datos de sus clientes u otros terceros declara tener autorización para hacerlo. WABOG usa la información no pública del Usuario solo para prestar el servicio, dar soporte, garantizar la seguridad y cumplir obligaciones legales, y puede apoyarse en proveedores tecnológicos para ello.

WABOG aplica medidas razonables de seguridad. Ningún sistema conectado a Internet es completamente infalible. El Usuario debe proteger sus credenciales y avisar de cualquier uso no autorizado de su cuenta.

## **10. Planes, pagos y cancelación**

Los precios, límites y periodicidad de cada plan son los indicados antes de contratar o en la propuesta comercial. WABOG informará el precio antes de cobrar.

El Usuario puede decidir no renovar su suscripción por los medios habilitados. Si no se renueva, WABOG puede suspender el monitoreo, las alertas y las funciones del plan. WABOG respeta los derechos que la ley reconoce al consumidor, incluido el derecho de retracto cuando proceda.

## **11. Limitación de responsabilidad**

Dentro de lo permitido por la ley, WABOG no responde por daños que provengan de fallas de las fuentes externas, información incorrecta publicada por terceros, restricciones de acceso impuestas por autoridades, datos mal registrados por el Usuario, fallas de proveedores de correo, mensajería o infraestructura, fuerza mayor o caso fortuito, ni por el uso de información de WABOG sin verificarla cuando era razonable consultar la fuente oficial.

En relaciones entre empresas o profesionales, la responsabilidad total de WABOG se limita al valor pagado por el Usuario en los 3 meses anteriores al hecho que originó la reclamación, y WABOG no responde por daños indirectos o consecuenciales. Estas limitaciones no aplican en caso de dolo, culpa grave ni cuando la ley no las permita, y no afectan los derechos irrenunciables del consumidor.

## **12. Propiedad intelectual**

El software, las marcas, los diseños, los algoritmos y los demás contenidos propios de la plataforma pertenecen a WABOG o a sus licenciantes. El Usuario recibe un derecho limitado, temporal, revocable y no exclusivo de uso, conforme a su plan, y conserva los derechos sobre la información propia que incorpore.

## **13. Usos prohibidos y suspensión**

El Usuario no puede usar la plataforma para fines ilegales, vulnerar su seguridad, acceder a cuentas ajenas, introducir malware, automatizar accesos sin autorización, revender el servicio ni afectar derechos de terceros.

WABOG puede suspender una cuenta por falta de pago, fraude, uso ilegal, riesgos de seguridad, abuso del servicio o incumplimiento de estos Términos, y cuando sea posible avisará al Usuario.

## **14. Servicios de terceros y comunicaciones**

WABOG se integra con servicios de terceros (mensajería, correo, pagos, infraestructura, inteligencia artificial, autenticación y almacenamiento), cuya disponibilidad y condiciones dependen de cada proveedor. El Usuario autoriza a WABOG a enviarle las comunicaciones necesarias para el servicio, como alertas, avisos de seguridad, facturación, renovaciones y cambios importantes. Las comunicaciones comerciales requieren la autorización correspondiente.

## **15. Cambios a estos Términos**

WABOG puede actualizar estos Términos por cambios del producto, de la regulación, de la seguridad o de sus proveedores. Los cambios sustanciales se comunicarán de forma razonable, y se publicará la fecha de la última actualización.

## **16. Reclamaciones, controversias y ley aplicable**

Para solicitudes, quejas o reclamaciones, escribe a <wabog.ia@gmail.com>. Las partes procurarán resolver cualquier controversia de buena fe y de manera directa; si no es posible, será competente la autoridad colombiana que corresponda. Estos Términos, el plan contratado y las políticas de privacidad y de datos personales forman el marco contractual del servicio. Si una disposición resulta inválida, las demás siguen vigentes.`;
